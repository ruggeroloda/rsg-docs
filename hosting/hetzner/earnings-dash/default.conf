# Earnings dashboard: one static page behind a password (analytics/earnings-dashboard/README.md).
# Container rsg-dash (nginx:alpine) on the compose "proxy" network, reached only through Nginx Proxy Manager.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    auth_basic "RSG earnings";
    auth_basic_user_file /etc/nginx/htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /robots.txt { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { try_files /index.html =404; }
}
